name: Generate YouTube lessons

on:
  workflow_dispatch:
    inputs:
      lesson:
        description: "Lesson script path, or lesson-batch for all course lessons"
        required: true
        default: "lesson-batch"

permissions:
  contents: write

concurrency:
  group: youtube-lessons
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render lesson and convert to horizontal 16:9
        env:
          LESSON: ${{ github.event.inputs.lesson }}
          STRICT_VOICE: "1"
        run: |
          mkdir -p youtube-output portrait-temp
          if [ "$LESSON" = "lesson-batch" ]; then
            files=$(ls stories/lesson-*.txt)
          else
            files="$LESSON"
          fi
          for f in $files; do
            b=$(basename "${f%.txt}")
            python tinyvideo.py "$f" -o "portrait-temp/$b.mp4"
            # Keep the complete animation visible; a blurred enlarged copy fills the 16:9 frame.
            ffmpeg -y -i "portrait-temp/$b.mp4" \
              -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,boxblur=28:10[blur];[fg]scale=608:1080:force_original_aspect_ratio=decrease[front];[blur][front]overlay=(W-w)/2:(H-h)/2,setsar=1[v]" \
              -map "[v]" -map 0:a? -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart "youtube-output/$b.mp4"
            python cover.py "$f" "youtube-output/$b.jpg" || true
          done
      - name: Save generated YouTube videos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add youtube-output
          git commit -m "Generate horizontal YouTube lesson videos [skip ci]" || echo "No generated files to commit"
          git pull --rebase
          git push
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: tiny-japanese-youtube-lessons
          path: youtube-output/
          if-no-files-found: error
          retention-days: 30
