name: Generate videos

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story file (e.g. stories/01-whats-your-name.txt) or 'all'"
        default: "all"
      post:
        description: "Post to Instagram after rendering? (true/false)"
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render
        env:
          STORY: ${{ github.event.inputs.story }}
        run: |
          mkdir -p output
          if [ -z "$STORY" ] || [ "$STORY" = "all" ]; then files=$(ls stories/*.txt); else files="$STORY"; fi
          for f in $files; do
            python tinyvideo.py "$f" -o "output/$(basename "${f%.txt}").mp4"
          done
      - name: Commit videos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git commit -m "Render videos [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
      - name: Build site
        run: |
          mkdir -p site/videos
          cp -r docs/* site/
          cp output/*.mp4 site/videos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy
    if: ${{ github.event.inputs.post == 'true' && github.event.inputs.story != 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Reel
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          STORY: ${{ github.event.inputs.story }}
        run: |
          if [ -z "$COMPOSIO_API_KEY" ]; then echo "::error::Add the COMPOSIO_API_KEY repository secret to enable Instagram posting."; exit 1; fi
          python publish.py "$STORY" "output/$(basename "${STORY%.txt}").mp4"
