name: Generate videos

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story file (e.g. stories/01-whats-your-name.txt) or 'all'"
        default: "all"
  push:
    paths:
      - "stories/**.txt"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render
        env:
          STORY: ${{ github.event.inputs.story }}
        run: |
          mkdir -p output
          if [ -z "$STORY" ] || [ "$STORY" = "all" ]; then files=$(ls stories/*.txt); else files="$STORY"; fi
          for f in $files; do
            python tinyvideo.py "$f" -o "output/$(basename "${f%.txt}").mp4"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/*.mp4
      - name: Commit videos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git commit -m "Render videos [skip ci]" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
