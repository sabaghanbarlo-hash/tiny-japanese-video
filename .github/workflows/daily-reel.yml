name: Daily reel

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only test the Composio key and Instagram connection (posts nothing)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Instagram connection
        if: ${{ github.event.inputs.check_only == 'true' }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python -u publish.py x x --check
      - name: Pick next video
        id: pick
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: |
          next=$(python pick_next.py)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ -z "$next" ]; then echo "Queue is empty - nothing to post today."; else echo "Next up: $next"; fi
      - name: Publish Reel
        if: ${{ steps.pick.outputs.next != '' }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          STORY: ${{ steps.pick.outputs.next }}
        run: python -u publish.py "$STORY" "output/$(basename "${STORY%.txt}").mp4"
      - name: Mark as posted
        if: ${{ steps.pick.outputs.next != '' }}
        env:
          STORY: ${{ steps.pick.outputs.next }}
        run: |
          basename "${STORY%.txt}" >> posted.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posted.txt
          git commit -m "Mark as posted [skip ci]"
          git pull --rebase || true
          git push
